<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service Wing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Give+You+Glory&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light and dark theme">
    <span class="theme-icon">🌙</span>
  </button>

  <div class="layout">

    <!-- SIDEBAR: identity + category legend. Purely visual grouping —
         the real links live on the tiles in the grid to the right. -->
    <aside class="sidebar">
      <div class="brand">
        <p class="eyebrow">// personal infrastructure</p>
        <h1>Service Wing</h1>
        <p class="tagline">Command deck for everything self-hosted.</p>
      </div>

      <nav class="category-rail">
        <div class="category" style="--cat-color: var(--accent);">
          <span class="category-dot"></span>
          <span class="category-name">Dev &amp; Automation</span>
        </div>
        <div class="category" style="--cat-color: #4dd6c0;">
          <span class="category-dot"></span>
          <span class="category-name">Notes &amp; Knowledge</span>
        </div>
        <div class="category" style="--cat-color: #ff9c6b;">
          <span class="category-dot"></span>
          <span class="category-name">Finance</span>
        </div>
      </nav>

      <p class="sidebar-footer">err404memory &middot; deployed from <code>main</code></p>
    </aside>

    <!-- MAIN: bento grid. Tile size signals how often you actually use
         the thing — not alphabetical, not by category. -->
    <main class="bento">

      <a class="tile tile-hero" href="https://n8n.err404memory.com">
        <div class="tile-top">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="var(--accent)" stroke-width="1.5"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.3 11 16.8 6.8M7.3 13 16.8 17.2"/></svg>
          <span class="tile-annotation">most used</span>
        </div>
        <div class="tile-body">
          <div class="tile-name">n8n</div>
          <div class="tile-desc">Workflow automation</div>
        </div>
      </a>

      <a class="tile tile-tall" href="https://git.err404memory.com">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M6 8v8M6 12c0-3.3 2.7-6 6-6h4"/></svg>
        <div class="tile-body">
          <div class="tile-name">Forgejo</div>
          <div class="tile-desc">Git, self-forged</div>
        </div>
      </a>

      <a class="tile tile-tall" href="https://affine.err404memory.com">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <div class="tile-body">
          <div class="tile-name">AFFiNE</div>
          <div class="tile-desc">Docs &amp; blocks</div>
        </div>
      </a>

      <a class="tile tile-stub" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l4 6h-2.5l3.5 5h-3v4h-4v-4h-3l3.5-5H8z"/></svg>
        <div class="tile-body">
          <div class="tile-name">Trilium</div>
        </div>
        <span class="tile-annotation">soon</span>
      </a>

      <a class="tile tile-stub" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l2.5 2.5L16 9"/></svg>
        <div class="tile-body">
          <div class="tile-name">Todozi</div>
        </div>
        <span class="tile-annotation">soon</span>
      </a>

      <a class="tile tile-stub" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M15 14h2"/></svg>
        <div class="tile-body">
          <div class="tile-name">Balance</div>
        </div>
        <span class="tile-annotation">soon</span>
      </a>

      <a class="tile tile-ghost" href="#" aria-disabled="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
        <span class="tile-annotation">what's next?</span>
      </a>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
